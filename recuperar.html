<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUTPLAY | Recuperar Contraseña</title>
  <link rel="stylesheet" href="./css/estilos.css">
  <link rel="stylesheet" href="./css/estilos-dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="pagina-autenticacion">
  <header class="barra-navegacion">
    <div class="logo">
      <a href="index.html"><img src="imágenes/logo-futplay.jpg" alt="FUTPLAY"></a>
    </div>
    <div>
      <a href="login.html" class="boton-secundario">Volver a Login</a>
    </div>
  </header>

  <main class="contenedor-formulario-login">
    <h2 class="titulo-formulario">RECUPERAR <span>CONTRASEÑA</span></h2>
    <p class="subtitulo-formulario">Escribe tu correo para recuperar el acceso</p>

    <form id="form-recuperar">
      <div class="campo-formulario">
        <label for="correo">Correo Electrónico Registrado:</label>
        <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
      </div>
      <button type="submit" class="boton-ingresar">Enviar Enlace</button>
    </form>

    <div class="enlaces-ayuda">
      <p><a href="login.html">Volver al Inicio de Sesión</a></p>
    </div>
  </main>

  <script src="js/validaciones.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/recuperar.js"></script>
</body>
</html>
